<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weedzap Control Panel</title>

    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="static/style.css">
</head>
<body>

<header class="dashboard-header panel">
    <h1>Weedzap Control Panel</h1>

    <div class="theme-switch">
        <label class="switch">
            <input type="checkbox" id="theme-toggle">
            <span class="slider"></span>
        </label>
        <span class="theme-label">Dark</span>
    </div>
</header>

<div id="dashboard-grid">

    <!-- CAMERA -->
    <div class="tile camera-tile panel">
        <h2>Camera Feed</h2>
        <img id="cameraFeed" src="">
    </div>

    <!-- STATUS -->
    <div class="tile panel">
        <h2>Status</h2>
        <p>Websocket: <span id="ws-status">Disconnected</span></p>
        <p>Position: <span id="current-pos">N/A</span></p>
        <p>Status: <span id="current-status">N/A</span></p>
    </div>

    <!-- MOVEMENT -->
    <div class="tile panel">
        <h2>Movement</h2>

        <div class="control-group">
            <h3>Move Absolute</h3>
            <input type="number" id="move-x" placeholder="X">
            <input type="number" id="move-y" placeholder="Y">
            <input type="number" id="move-z" placeholder="Z">
            <input type="number" id="move-speed" placeholder="Speed">
            <button id="btn-move-to">Move</button>
        </div>

        <div class="control-group">
            <h3>Jog</h3>
            <input type="number" id="jog-dx" placeholder="dX">
            <input type="number" id="jog-dy" placeholder="dY">
            <input type="number" id="jog-dz" placeholder="dZ">
            <button id="btn-jog">Jog</button>
        </div>

        <div class="control-group">
            <button id="btn-home">Home</button>
            <button id="btn-pos-query">Position</button>
            <button id="btn-status-query">Full Status</button>
        </div>
    </div>

    <!-- CURRENT CONFIG -->
    <div class="tile panel">
        <h2>Current Config</h2>
        <p>X Steps: <span id="current-steps_x">N/A</span></p>
        <p>Y Steps: <span id="current-steps_y">N/A</span></p>
        <p>Z Steps: <span id="current-steps_z">N/A</span></p>
        <p>Max Speed: <span id="current-max_speed">N/A</span></p>
        <p>Accel: <span id="current-accel">N/A</span></p>
    </div>

    <!-- LED -->
    <div class="tile panel">
        <h2>LED</h2>
        <div class="control-group row">
            <button id="btn-led-on">ON</button>
            <button id="btn-led-off">OFF</button>
        </div>
    </div>

    <!-- TOOL CONTROL -->
    <div class="tile panel">
        <h2>Tool</h2>

        <div class="control-group">
            <input type="number" id="tool-number" min="1" max="2">
            <button id="btn-tool-on">On</button>
            <button id="btn-tool-off">Off</button>
        </div>

        <div class="control-group">
            <input type="number" id="fire-value" min="0" max="255" placeholder="Value">
            <button id="btn-fire">Set Value</button>
        </div>
    </div>

    <!-- CONFIG SET -->
    <div class="tile panel">
        <h2>Set Config</h2>

        <div class="control-group">
            <label>Steps X</label>
            <input type="number" id="set-steps_x">
            <button id="btn-set-steps_x">Set</button>
        </div>

        <div class="control-group">
            <label>Max Speed</label>
            <input type="number" id="set-max_speed">
            <button id="btn-set-max_speed">Set</button>
        </div>

        <div class="control-group">
            <label>Acceleration</label>
            <input type="number" id="set-accel">
            <button id="btn-set-accel">Set</button>
        </div>
    </div>

    <!-- CONSOLE -->
    <div class="tile console-tile panel">
        <h2>Console</h2>
        <div id="log-output"></div>
        <div class="arduino-command-input-group">
            <input type="text" id="arduino-command-input" placeholder="G0 X10 Y20">
            <button id="send-arduino-command">Send</button>
        </div>
    </div>

</div>

<script src="static/script.js"></script>
</body>
</html>
